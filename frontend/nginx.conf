server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Compression des ressources textuelles. Les images et vidéos sont déjà
    # compressées dans leur propre format et ne gagnent pas à repasser en gzip.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        application/xml
        application/xml+rss
        image/svg+xml;

    # Le document HTML doit toujours être revalidé afin qu'un déploiement ne
    # conserve pas une ancienne liste de fichiers JS/CSS hachés.
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Les fichiers générés par Vite portent une empreinte dans leur nom. Les
    # médias et polices du projet sont également immuables entre deux builds.
    location ~* \.(?:js|css|png|jpg|jpeg|gif|webp|avif|ico|svg|woff|woff2|ttf|mp4|webm|json)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Les consignes d'exploration peuvent évoluer indépendamment du bundle.
    location = /robots.txt {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    location = /sitemap.xml {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    # Routage SPA : toute URL applicative valide retombe sur index.html.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
