version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: sailingloc_postgres_dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: sailingloc_dev
      POSTGRES_USER: sailingloc_user
      POSTGRES_PASSWORD: sailingloc_password
    ports:
      - '5433:5432' # Different port to avoid conflicts with local PostgreSQL
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sailingloc_network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sailingloc_user -d sailingloc_dev']
      interval: 30s
      timeout: 10s
      retries: 3

  # Backend API (Development mode with hot reload)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: sailingloc_backend_dev
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgresql://sailingloc_user:sailingloc_password@postgres:5432/sailingloc_dev
      JWT_SECRET: dev_jwt_secret_change_this
      STRIPE_SECRET_KEY: sk_test_your_stripe_secret_key
      EMAIL_HOST: smtp.gmail.com
      EMAIL_PORT: 587
      EMAIL_USER: your_email@gmail.com
      EMAIL_PASS: your_app_password
    ports:
      - '4000:4000'
    volumes:
      - ./backend:/app
      - /app/node_modules
      - ./backend/uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sailingloc_network
    command: npm run dev

  # Frontend React App (Development mode with hot reload)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: sailingloc_frontend_dev
    restart: unless-stopped
    ports:
      - '5173:5173'
    environment:
      VITE_API_BASE_URL: http://localhost:4000/api
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - sailingloc_network
    command: npm run dev -- --host 0.0.0.0

  # pgAdmin - PostgreSQL Web Interface
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: sailingloc_pgadmin_dev
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@sailingloc.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_PROXY_X_FOR_COUNT: 1
      PGADMIN_CONFIG_PROXY_X_PROTO_COUNT: 1
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
    ports:
      - '5050:80'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin_servers.json:/pgadmin4/servers.json
    depends_on:
      - postgres
    networks:
      - sailingloc_network

volumes:
  postgres_data:
  pgadmin_data:

networks:
  sailingloc_network:
    driver: bridge
