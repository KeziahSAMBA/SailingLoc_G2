version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: sailingloc_postgres
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # Database traffic stays on the private Docker network. Use an explicit
    # temporary tunnel for maintenance instead of publishing the port.
    expose:
      - '5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/prisma/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - sailingloc_network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 30s
      timeout: 10s
      retries: 3

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sailingloc_backend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      NODE_ENV: production
      DEPLOYMENT_ENV: production
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      FILE_ENCRYPTION_KEY: ${FILE_ENCRYPTION_KEY}
      APP_URL: ${APP_URL}
      PUBLIC_API_URL: ${PUBLIC_API_URL:?PUBLIC_API_URL must be set to the public HTTPS API origin}
      EMAIL_HOST: ${EMAIL_HOST}
      EMAIL_PORT: ${EMAIL_PORT}
      EMAIL_USER: ${EMAIL_USER}
      EMAIL_PASS: ${EMAIL_PASS}
      EMAIL_SECURE: ${EMAIL_SECURE:-false}
      EMAIL_IGNORE_TLS: ${EMAIL_IGNORE_TLS:-false}
      MAILGUN_API_KEY: ${MAILGUN_API_KEY}
      MAILGUN_DOMAIN: ${MAILGUN_DOMAIN}
      MAILGUN_HOST: ${MAILGUN_HOST:-api.mailgun.net}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      # A production container must never be allowed to reset a database with
      # the demonstration seed, even if its command is overridden locally.
      SEED_FORCE: 'false'
    # Keep the host diagnostic/reverse-proxy path available without exposing
    # the API on the LAN. Other containers use backend:4000 on the private
    # Docker network.
    ports:
      - '127.0.0.1:4000:4000'
    expose:
      - '4000'
    volumes:
      - uploads_data:/app/uploads
      - documents_data:/app/storage/documents
      - disputes_data:/app/storage/disputes
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sailingloc_network
    healthcheck:
      # The runtime image is deliberately minimal and does not ship curl.
      # Reuse Node's built-in fetch for a healthcheck that also works as the
      # Dockerfile HEALTHCHECK under the non-root runtime user.
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend React App
  frontend:
    build:
      # Keep local production builds identical to Railway's repository-root
      # context, so COPY paths and the generated Nginx policy are exercised in
      # the same way before deployment.
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:?VITE_API_BASE_URL must be set to the public HTTPS API URL}
        VITE_MATOMO_URL: ${VITE_MATOMO_URL:-}
        VITE_STRIPE_PUBLISHABLE_KEY: ${VITE_STRIPE_PUBLISHABLE_KEY:-}
        VITE_BUILD_ENV: production
    container_name: sailingloc_frontend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - '3000:8080'
    depends_on:
      - backend
    networks:
      - sailingloc_network

  # Redis (optional, for caching/session management)
  redis:
    image: redis:7-alpine
    container_name: sailingloc_redis
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    # Redis is not currently consumed by the API; keep it private for future
    # rate-limit/session stores and fail closed when no password is supplied.
    expose:
      - '6379'
    volumes:
      - redis_data:/data
    networks:
      - sailingloc_network
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    command:
      - sh
      - -c
      - >-
        test -n "$$REDIS_PASSWORD" &&
        exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
    healthcheck:
      test: ['CMD-SHELL', 'REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping']
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
  redis_data:
  uploads_data:
  documents_data:
  disputes_data:

networks:
  sailingloc_network:
    driver: bridge
