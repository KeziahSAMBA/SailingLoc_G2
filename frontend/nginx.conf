server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # The production/staging image is served behind TLS termination. Browsers
    # ignore HSTS received over plain HTTP, while HTTPS deployments get a
    # one-year policy covering their subdomains.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), geolocation=(), gyroscope=(), microphone=(), payment=(self \"https://js.stripe.com\" \"https://hooks.stripe.com\"), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    # This image is the production/staging static server. Local origins are
    # intentionally absent; development uses Vite's Dockerfile.dev and never
    # consumes this policy. VITE_API_BASE_URL must point at a public HTTPS API
    # and is validated before the bundle is built.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self' https://js.stripe.com https://analytics.sailingloc.fr; script-src-attr 'none'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://randomuser.me https://images.unsplash.com https://images.pexels.com https://a.basemaps.cartocdn.com https://b.basemaps.cartocdn.com https://c.basemaps.cartocdn.com https://d.basemaps.cartocdn.com https://*.stripe.com; connect-src 'self' https://api.sailingloc.fr https://api.stripe.com https://r.stripe.com https://m.stripe.com https://q.stripe.com https://nominatim.openstreetmap.org https://analytics.sailingloc.fr https://a.basemaps.cartocdn.com https://b.basemaps.cartocdn.com https://c.basemaps.cartocdn.com https://d.basemaps.cartocdn.com; frame-src 'self' blob: https://js.stripe.com https://hooks.stripe.com https://payments.stripe.com; media-src 'self' blob:; worker-src 'self' blob:; manifest-src 'self'" always;

    # Enable gzip compression for immutable application assets and JSON.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    # Never serve hidden files (including accidental environment files).
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Handle client-side routing. Unknown paths are rendered by React rather
    # than leaking filesystem details.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache Vite's hashed assets. `expires` adds Cache-Control without a child
    # add_header, so the security headers above remain inherited.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff2?|ttf|mp4)$ {
        expires 1y;
    }

    # Health check endpoint; default_type avoids overriding inherited headers.
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }
}
