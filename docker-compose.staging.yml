version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: sailingloc_postgres_staging
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # PostgreSQL is reachable only by the backend on the private network.
    expose:
      - '5432'
    volumes:
      - postgres_staging_data:/var/lib/postgresql/data
    networks:
      - sailingloc_network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 30s
      timeout: 10s
      retries: 3

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sailingloc_backend_staging
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      NODE_ENV: staging
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      FILE_ENCRYPTION_KEY: ${FILE_ENCRYPTION_KEY}
      APP_URL: ${APP_URL}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      EMAIL_HOST: ${EMAIL_HOST}
      EMAIL_PORT: ${EMAIL_PORT}
      EMAIL_USER: ${EMAIL_USER}
      EMAIL_PASS: ${EMAIL_PASS}
      SEED_FORCE: 'false'
    ports:
      - '4100:4000'
    volumes:
      - uploads_staging_data:/app/uploads
      - documents_staging_data:/app/storage/documents
      - disputes_staging_data:/app/storage/disputes
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # Keep staging aligned with the production image's built-in check.
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - sailingloc_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sailingloc_frontend_staging
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL}
      VITE_MATOMO_URL: ${VITE_MATOMO_URL:-}
    ports:
      - '5174:8080'
    depends_on:
      - backend
    networks:
      - sailingloc_network

networks:
  sailingloc_network:
    driver: bridge

volumes:
  postgres_staging_data:
  uploads_staging_data:
  documents_staging_data:
  disputes_staging_data:
