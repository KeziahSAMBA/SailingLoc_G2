version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: sailingloc_postgres_staging
    restart: unless-stopped
    environment:
      POSTGRES_DB: sailingloc_staging
      POSTGRES_USER: sailingloc_user
      POSTGRES_PASSWORD: sailingloc_password
    ports:
      - '5434:5432'
    volumes:
      - postgres_staging_data:/var/lib/postgresql/data
    networks:
      - sailingloc_network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sailingloc_user -d sailingloc_staging']
      interval: 30s
      timeout: 10s
      retries: 3

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sailingloc_backend_staging
    restart: unless-stopped
    environment:
      NODE_ENV: staging
      PORT: 4000
      DATABASE_URL: postgresql://sailingloc_user:sailingloc_password@postgres:5432/sailingloc_staging
      JWT_SECRET: staging_jwt_secret
      STRIPE_SECRET_KEY: sk_test_yourkey_staging
      EMAIL_HOST: smtp.example.com
      EMAIL_PORT: 587
      EMAIL_USER: youruser@example.com
      EMAIL_PASS: yourpassword
    ports:
      - '4100:4000'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sailingloc_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sailingloc_frontend_staging
    restart: unless-stopped
    environment: VITE_API_BASE_URL=http://localhost:4100/api
    ports:
      - '5174:80'
    depends_on:
      - backend
    networks:
      - sailingloc_network

networks:
  sailingloc_network:
    driver: bridge

volumes:
  postgres_staging_data:
