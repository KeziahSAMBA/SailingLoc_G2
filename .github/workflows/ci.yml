name: CI/CD

on:
  push:
    branches:
      - master
      - develop
      - staging
  pull_request:
    branches:
      - master
      - develop
      - staging

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20]

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Install dependencies
        run: npm install

      - name: Run lint for backend and frontend
        run: npm run lint

      - name: Run backend tests
        run: npm test

      - name: Build frontend
        run: npm run build --workspace frontend

      - name: Check formatting
        run: npx prettier --check .

  deploy-staging:
    runs-on: ubuntu-latest
    needs: test-and-build
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/staging'
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to staging
        run: |
          echo "Déploiement vers staging en cours..."
          # Ajouter ici les commandes de déploiement pour staging
          # Par exemple: docker-compose -f docker-compose.staging.yml up -d

  deploy-production:
    runs-on: ubuntu-latest
    needs: test-and-build
    if: github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to production
        run: |
          echo "Déploiement vers production en cours..."
          # Ajouter ici les commandes de déploiement pour production
          # Par exemple: docker-compose -f docker-compose.prod.yml up -d
