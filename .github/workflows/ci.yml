name: CI/CD

permissions:
  contents: read

on:
  push:
    branches:
      - master
      - develop
      - staging
      - feature/security-audit
  pull_request:
    branches:
      - master
      - develop
      - staging
      - feature/security-audit

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20]

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate Prisma client
        run: npm exec --workspace backend -- prisma generate --schema prisma/schema.prisma

      - name: Run lint for backend and frontend
        run: npm run lint

      - name: Run backend tests
        run: npm test

      - name: Build frontend
        env:
          VITE_API_BASE_URL: https://api.sailingloc.fr/api
          VITE_BUILD_ENV: production
        run: npm run build --workspace frontend

      # The repository predates this gate and contains unrelated formatting
      # drift. Keep the check scoped to the security workflow so it remains a
      # useful, non-destructive validation without a global reformat.
      - name: Check workflow formatting
        run: npx prettier --check .github/workflows/ci.yml .github/workflows/security.yml

  deploy-staging:
    runs-on: ubuntu-latest
    needs: test-and-build
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/staging'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Deploy to staging
        run: |
          echo "Déploiement vers staging en cours..."
          # Ajouter ici les commandes de déploiement pour staging
          # Par exemple: docker-compose -f docker-compose.staging.yml up -d

  deploy-production:
    runs-on: ubuntu-latest
    needs: test-and-build
    if: github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Deploy to production
        run: |
          echo "Déploiement vers production en cours..."
          # Ajouter ici les commandes de déploiement pour production
          # Par exemple: docker-compose -f docker-compose.prod.yml up -d
