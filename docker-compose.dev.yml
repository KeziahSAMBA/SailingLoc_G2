version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: sailingloc_postgres_dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - '5433:5432' # Different port to avoid conflicts with local PostgreSQL
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/prisma/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - sailingloc_network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 30s
      timeout: 10s
      retries: 3

  # MailDev — SMTP local + interface web (dev only)
  maildev:
    image: maildev/maildev:latest
    container_name: sailingloc_maildev
    restart: unless-stopped
    ports:
      - '1080:1080' # Interface web : http://localhost:1080
      - '1025:1025' # SMTP
    networks:
      - sailingloc_network

  # Backend API (Development mode with hot reload)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: sailingloc_backend_dev
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      EMAIL_HOST: maildev
      EMAIL_PORT: 1025
      EMAIL_USER: ''
      EMAIL_PASS: ''
    ports:
      - '4000:4000'
    volumes:
      - ./backend:/app
      - /app/node_modules
      - ./backend/uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      maildev:
        condition: service_started
    networks:
      - sailingloc_network
    command: sh -c "npx prisma generate && npx prisma migrate deploy && npx prisma db seed && node --watch src/server.js"

  # Frontend React App (Development mode with hot reload)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: sailingloc_frontend_dev
    restart: unless-stopped
    ports:
      - '5173:5173'
    environment:
      VITE_API_BASE_URL: http://localhost:4000/api
      # URL publique de Matomo vue par le navigateur (en prod : https://analytics.<domaine>)
      VITE_MATOMO_URL: http://localhost:8081
      # Clé publique Stripe (pk_test_…) lue depuis le .env racine ; vide = paiement simulé.
      VITE_STRIPE_PUBLISHABLE_KEY: ${VITE_STRIPE_PUBLISHABLE_KEY:-}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - sailingloc_network
    command: npm run dev -- --host 0.0.0.0

  # Matomo — mesure d'audience self-hosted (dashboard : http://localhost:8081).
  # Le script de tracking n'est chargé par le frontend qu'avec le consentement
  # « mesure d'audience » (voir frontend/src/utils/matomo.js).
  matomo:
    image: matomo:latest
    container_name: sailingloc_matomo_dev
    restart: unless-stopped
    environment:
      MATOMO_DATABASE_HOST: matomo_db
      MATOMO_DATABASE_DBNAME: ${MATOMO_DB_NAME}
      MATOMO_DATABASE_USERNAME: ${MATOMO_DB_USER}
      MATOMO_DATABASE_PASSWORD: ${MATOMO_DB_PASSWORD}
    ports:
      - '8081:80'
    volumes:
      - matomo_data:/var/www/html
    depends_on:
      - matomo_db
    networks:
      - sailingloc_network

  # MariaDB dédiée à Matomo (Matomo ne supporte pas PostgreSQL) — isolée de la
  # base métier, port non publié : accessible uniquement depuis le réseau Docker.
  matomo_db:
    image: mariadb:11
    container_name: sailingloc_matomo_db_dev
    restart: unless-stopped
    command: --max-allowed-packet=64MB
    environment:
      MYSQL_ROOT_PASSWORD: ${MATOMO_DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MATOMO_DB_NAME}
      MYSQL_USER: ${MATOMO_DB_USER}
      MYSQL_PASSWORD: ${MATOMO_DB_PASSWORD}
    volumes:
      - matomo_db_data:/var/lib/mysql
    networks:
      - sailingloc_network

  # pgAdmin - PostgreSQL Web Interface
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: sailingloc_pgadmin_dev
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_CONFIG_PROXY_X_FOR_COUNT: 1
      PGADMIN_CONFIG_PROXY_X_PROTO_COUNT: 1
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
    ports:
      - '5050:80'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin_servers.json:/pgadmin4/servers.json
    depends_on:
      - postgres
    networks:
      - sailingloc_network

volumes:
  postgres_data:
  pgadmin_data:
  matomo_data:
  matomo_db_data:

networks:
  sailingloc_network:
    driver: bridge
